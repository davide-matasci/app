name: Fork Home Server bundle

# Personal-fork build: packages the Standard Notes home server (Node.js +
# SQLite, see selfhost/home-server/) for an Alpine (musl) root, such as
# myos's Linux layer, and attaches it to a GitHub release of this repository.

on:
  workflow_dispatch:
    inputs:
      server_ref:
        description: 'standardnotes/server commit to build'
        required: true
        default: 'b7d2f3664e005aba6e4df14eb73dc3f2e622f5a2'

permissions:
  contents: write

jobs:
  bundle:
    # Never runs in the upstream repository.
    if: github.repository != 'standardnotes/app'
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build in Alpine
        env:
          SERVER_REF: ${{ inputs.server_ref }}
        run: |
          docker run --rm -e SERVER_REF -v "$PWD:/repo" alpine:3 \
            sh /repo/selfhost/home-server/build-bundle.sh /repo/out
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
          SERVER_REF: ${{ inputs.server_ref }}
        run: |
          tag="home-server-${SERVER_REF:0:7}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" \
            --title "Standard Notes home server (${SERVER_REF:0:7})" \
            --notes "Built from standardnotes/server@${SERVER_REF} for Alpine/musl. Setup: selfhost/home-server/README.md" \
            --target "$GITHUB_SHA" || true
          gh release upload "$tag" out/*.tar.gz --clobber
